name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore does not exist. Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or find debug.keystore."
            exit 1
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK not found!"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) echo "Verified extension: .apk" ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac

          echo "APK successfully verified at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d /tmp/apk-release-asset-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          # Sanitize repository name to only safe alphanumeric characters and dashes
          REPO_SAFE=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi
          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset is empty or missing."
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset invalid or not found."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
This is an automatically generated debug APK.
The APK was built by GitHub Actions.
- GitHub Actions Run Number: ${{ github.run_number }}
- GitHub Actions Run Attempt: ${{ github.run_attempt }}
- Source Commit SHA: ${{ github.sha }}

Notes:
- The APK is intended for testing.
- The APK is not a Play Store production release.
- The APK is signed only with a temporary debug keystore.
EOF
)

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.create_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "### 🚀 Debug APK Published Successfully!"
              echo ""
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename**: \`$ASSET_FILENAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo "The normal Actions artifact named \`app-debug-apk\` is also available as a backup under the workflow summary."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the APK was successfully built."
            echo "The GitHub Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was built successfully, but GitHub Release publishing failed or encountered an error."
              echo "- **Actions Artifact**: The APK is safely preserved as an Actions artifact named \`app-debug-apk\`."
              echo "- You can download \`app-debug-apk\` directly from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
